server:
  port: ${GATEWAY_PORT}

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lowerCaseServiceId: true
      httpclient:
        websocket:
          max-frame-payload-length: 65536
      routes:
        # ── WebSocket route for Chat service ──
        - id: apollo-chat-websocket
          uri: lb://apollo-chat
          predicates:
            - Path=/apollo-chat/ws/**
          filters:
            - StripPrefix=1

        # ── Chat HTTP ──
        - id: apollo-chat
          uri: lb://apollo-chat
          predicates:
            - Path=/apollo-chat/**
          filters:
            - StripPrefix=1

        # ── Board HTTP ──
        - id: apollo-board
          uri: lb://apollo-board
          predicates:
            - Path=/apollo-board/**
          filters:
            - StripPrefix=1

        # ── Sync HTTP (NEW) ──
        - id: apollo-sync
          uri: lb://apollo-sync
          predicates:
            - Path=/apollo-sync/**
          filters:
            - StripPrefix=1